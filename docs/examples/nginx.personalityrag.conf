# Put this log_format in the nginx http {} block. $uri excludes the query string.
log_format personalityrag_adapter_safe
    '$request_id $request_method $uri $status $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name memory.example.com;

    ssl_certificate     /etc/letsencrypt/live/memory.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memory.example.com/privkey.pem;

    access_log /var/log/nginx/personalityrag-adapter-access.log
        personalityrag_adapter_safe;
    error_log /var/log/nginx/personalityrag-adapter-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;
    }
}
