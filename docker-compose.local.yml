name: personalityrag

services:
  personalityrag:
    build:
      context: ${PERSONALITYRAG_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
      target: runtime
      args:
        PERSONALITYRAG_VERSION: v0.1.1
        VCS_REF: ${PERSONALITYRAG_VCS_REF:-development}
    image: personalityrag-linux:dev
    pull_policy: never
    container_name: ${PERSONALITYRAG_CONTAINER_NAME:-PersonalityRAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 70s
    ports:
      - "${PERSONALITYRAG_BIND_IP:-127.0.0.1}:${PERSONALITYRAG_WEBUI_HOST_PORT:-8765}:8765"
      - "${PERSONALITYRAG_BIND_IP:-127.0.0.1}:${PERSONALITYRAG_ACCESS_HOST_PORT:-8766}:8766"
    volumes:
      - type: bind
        source: ${PERSONALITYRAG_STATE_DIR:-./runtime}
        target: /app/state
      - type: bind
        source: ${PERSONALITYRAG_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PERSONALITYRAG_DEPLOYMENT: docker
      PERSONALITYRAG_STATE_ROOT: /app/state
      PERSONALITYRAG_DOCKER_SOCKET: /var/run/docker.sock
      PERSONALITYRAG_SUPPRESS_BROWSER: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
