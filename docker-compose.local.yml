name: personalityrag

services:
  personalityrag:
    build:
      context: ${PERSONALITYRAG_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
      target: runtime
      args:
        PERSONALITYRAG_VERSION: v0.1.0
        VCS_REF: ${PERSONALITYRAG_VCS_REF:-development}
    image: personalityrag-linux:dev
    pull_policy: never
    container_name: ${PERSONALITYRAG_CONTAINER_NAME:-PersonalityRAG}
    restart: unless-stopped
    ports:
      - "${PERSONALITYRAG_BIND_IP:-127.0.0.1}:${PERSONALITYRAG_WEBUI_HOST_PORT:-8765}:8765"
      - "${PERSONALITYRAG_BIND_IP:-127.0.0.1}:${PERSONALITYRAG_ACCESS_HOST_PORT:-8766}:8766"
    volumes:
      - type: bind
        source: ${PERSONALITYRAG_STATE_DIR:-./runtime}
        target: /app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PERSONALITYRAG_DEPLOYMENT: docker
      PERSONALITYRAG_STATE_ROOT: /app/state
      PERSONALITYRAG_SUPPRESS_BROWSER: "1"
      PERSONALITYRAG_DEFAULT_EMBEDDING_API_BASE: ${PERSONALITYRAG_DEFAULT_EMBEDDING_API_BASE:-http://host.docker.internal:8001/v1}
